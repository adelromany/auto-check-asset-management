{#-
  Desktop left rail: 220px wide, icon and label always visible.
  The active item carries the b_labs mint underscore motif.
-#}
<aside data-rail class="rail hidden md:flex">
  <a href="/" class="rail-brand" aria-label="Handover Portal home">
    {% from "partials/logo.html" import logo %}
    {{ logo(40) }}
    <span class="rail-brand-name">Handover Portal</span>
  </a>
  <nav class="rail-nav" aria-label="Main">
    <a href="/" data-nav {% if active_nav == 'dashboard' %}data-nav-active="true"{% endif %} class="rail-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span class="rail-label" data-nav-label>Dashboard</span>
    </a>
    <a href="/handovers" data-nav {% if active_nav == 'handovers' %}data-nav-active="true"{% endif %} class="rail-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 2h6a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z"/><path d="M9 12h6M9 16h4"/></svg>
      <span class="rail-label" data-nav-label>Handovers</span>
    </a>
    <a href="/maintenance" data-nav {% if active_nav == 'maintenance' %}data-nav-active="true"{% endif %} class="rail-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      <span class="rail-label" data-nav-label>Maintenance</span>
    </a>
    <a href="/sync" data-nav {% if active_nav == 'sync' %}data-nav-active="true"{% endif %} class="rail-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span class="rail-label" data-nav-label>Sync</span>
    </a>
  </nav>
</aside>
