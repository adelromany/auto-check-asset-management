{#-
  Logo: the b_labs mark, shown whole (object-fit: contain, no crop) on an
  ink chip so its dark background blends in light mode.
-#}
{% macro logo(size=40, radius=10) -%}
<span class="logo-chip" style="width: {{ size }}px; height: {{ size }}px; border-radius: {{ radius }}px;">
  <img src="/static/img/b_labs.jpeg" alt="b_labs" width="{{ size }}" height="{{ size }}"
       class="logo-img" style="border-radius: {{ radius - 2 }}px;" data-logo>
</span>
{%- endmacro %}
