{#-
  Top bar: omnibox (search recipient, serial, asset tag, ticket, vendor)
  and the user menu with the theme toggle. "/" focuses the omnibox.
-#}
<header data-topbar class="topbar">
  <div class="topbar-inner">
    <a href="/" class="topbar-brand md:hidden" aria-label="Handover Portal home">
      {% from "partials/logo.html" import logo %}
      {{ logo(32) }}
    </a>

    <div class="omnibox" id="omnibox">
      <form id="omnibox-form" role="search" autocomplete="off">
        <label class="sr-only" for="omnibox-input">Search</label>
        <svg class="omnibox-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="omnibox-input" name="q" type="search" maxlength="100"
               placeholder="Search serial, person, ticket, vendor"
               aria-label="Search cases and devices"
               aria-describedby="omnibox-hint">
        <span class="omnibox-caret" aria-hidden="true"></span>
        <kbd class="omnibox-kbd" id="omnibox-hint">/</kbd>
      </form>
      <div id="omnibox-results" class="omnibox-results" hidden></div>
    </div>

    <div class="topbar-actions">
      <div class="user-menu" id="user-menu">
        <button type="button" id="user-menu-button" class="btn btn-ghost h-10 gap-2 px-2"
                aria-haspopup="true" aria-expanded="false" aria-label="User menu">
          <span class="avatar" data-user-avatar>?</span>
          <span class="hidden text-sm lg:inline" data-user-name>Engineer</span>
        </button>
        <div id="user-menu-pop" class="user-pop" hidden>
          <div class="user-pop-head">
            <span data-user-name class="text-sm font-medium">Engineer</span>
            <span data-user-email class="block text-xs text-muted-foreground"></span>
          </div>
          <a href="/logout" class="user-pop-item">Sign out</a>
        </div>
      </div>
      <button type="button" data-theme-toggle class="btn btn-ghost btn-icon" aria-label="Toggle theme">
        <svg data-theme-icon="sun" class="hidden size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
        <svg data-theme-icon="moon" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg data-theme-icon="monitor" class="hidden size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg>
      </button>
    </div>
  </div>
</header>
