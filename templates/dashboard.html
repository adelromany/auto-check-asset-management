{% extends "base.html" %}
{% block content %}
<h1 class="sr-only">Handover</h1>
<div class="page-head">
  <div class="row-between">
    <p class="page-intro">Handover</p>
    <button type="button" class="btn btn-default" data-new-handover>New handover</button>
  </div>
</div>
<section class="tiles handover-tiles" aria-label="Handover overview">
  <button type="button" class="tile tile-button" data-outcome="ready">
    <span class="tile-value" data-ready-count>—</span>
    <span class="tile-label">Ready labs</span>
    <span class="tile-chips" data-ready-companies></span>
  </button>
  <button type="button" class="tile tile-button" data-outcome="complete">
    <span class="tile-value" data-complete-count>—</span>
    <span class="tile-label">Complete</span>
  </button>
  <button type="button" class="tile tile-button" data-outcome="not_complete">
    <span class="tile-value" data-not-complete-count>—</span>
    <span class="tile-label">Not complete yet</span>
  </button>
</section>
<section class="card handover-results" aria-label="Handover cases">
  <div class="card-content">
    <div class="handover-list" data-handover-list><div class="empty" data-empty><span>—</span></div></div>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/dashboard.js" defer></script>{% endblock %}
