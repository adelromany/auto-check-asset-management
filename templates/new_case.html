<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  {% include "partials/page_head.html" %}
</head>
<body class="min-h-screen bg-background text-foreground md:pl-16 pb-16 md:pb-0 transition-[padding] duration-200">
{% include "partials/rail.html" %}
{% include "partials/bottom_nav.html" %}

<div class="mx-auto flex min-h-screen w-full flex-col">
  {% include "partials/topbar.html" %}

  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <form id="new-case-form" class="card border bg-card/60 p-6 shadow-sm rounded-2xl space-y-5">
        <div>
          <h1 class="text-lg font-bold tracking-tight">New case</h1>
          <p class="text-xs text-muted-foreground mt-0.5">Select type and enter serial</p>
        </div>

        {# Step 1: Two large case type tiles #}
        <div class="grid grid-cols-2 gap-3" role="radiogroup" aria-label="Case type">
          <label class="flex flex-col items-center justify-center gap-1.5 p-3 rounded-xl border-2 border-primary bg-primary/5 cursor-pointer text-xs font-semibold transition-all" id="label-kind-handover">
            <input type="radio" name="kind" value="handover" checked class="sr-only" />
            <svg class="size-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Handover</span>
          </label>

          <label class="flex flex-col items-center justify-center gap-1.5 p-3 rounded-xl border-2 border-border hover:border-primary/50 cursor-pointer text-xs font-semibold text-muted-foreground transition-all" id="label-kind-maintenance">
            <input type="radio" name="kind" value="maintenance" class="sr-only" />
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
            <span>Maintenance</span>
          </label>
        </div>

        {# Step 2: Serial (autofocus) & Ticket #}
        <div class="space-y-3">
          <div>
            <label for="new-serial" class="text-xs font-medium text-foreground block mb-1">Serial number</label>
            <input id="new-serial" name="device_serial" class="input font-mono text-sm w-full h-10 uppercase" required maxlength="100"
                   autofocus autocomplete="off" autocapitalize="characters" spellcheck="false"
                   placeholder="e.g. PF3ABCDE" dir="ltr" />
            <div id="snipeit-match" class="mt-1.5 flex flex-wrap gap-1 text-[11px] hidden"></div>
          </div>

          <div>
            <label for="new-ticket" class="text-xs font-medium text-muted-foreground block mb-1">Ticket (optional)</label>
            <input id="new-ticket" name="ticket_ref" class="input text-xs w-full h-9" maxlength="100"
                   autocomplete="off" placeholder="Ticket ref" />
          </div>

          <div id="active-case" class="hidden rounded-lg border border-amber-500/30 bg-amber-500/10 p-3 text-xs text-amber-900 dark:text-amber-200" role="status">
            <p id="active-case-text" class="font-medium"></p>
            <a id="active-case-link" class="btn btn-outline btn-xs mt-2" href="/cases">Open existing case →</a>
          </div>

          <div id="new-case-error" class="hidden rounded-lg border border-destructive/40 bg-destructive/10 p-3 text-xs text-destructive" role="alert">
            <p id="new-case-error-text"></p>
          </div>
        </div>

        <button type="submit" class="btn btn-default btn-sm w-full h-10 font-semibold text-xs shadow-xs">
          Register case
        </button>
      </form>
    </div>
  </main>
</div>

<div id="toast-stack" class="toast-stack" aria-live="polite"></div>

<script src="/static/js/theme.js?v=1"></script>
<script src="/static/js/shell.js?v=1"></script>
<script src="/static/js/new_case.js?v=2"></script>
</body>
</html>
